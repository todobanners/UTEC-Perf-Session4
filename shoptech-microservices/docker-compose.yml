version: '3.8'

services:
  # Authentication Service
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - JWT_SECRET=shoptech-secret-key-for-testing
      - NODE_ENV=development
    networks:
      - shoptech-network
    volumes:
      - ./logs:/app/logs

  # User Profile Service
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - JWT_SECRET=shoptech-secret-key-for-testing
      - NODE_ENV=development
    depends_on:
      - auth-service
    networks:
      - shoptech-network
    volumes:
      - ./logs:/app/logs

  # Product Catalog Service
  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - NODE_ENV=development
    networks:
      - shoptech-network
    volumes:
      - ./logs:/app/logs

  # Shopping Cart Service
  cart-service:
    build:
      context: ./services/cart-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - JWT_SECRET=shoptech-secret-key-for-testing
      - NODE_ENV=development
    depends_on:
      - auth-service
      - product-service
    networks:
      - shoptech-network
    volumes:
      - ./logs:/app/logs

  # Order Processing Service
  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - JWT_SECRET=shoptech-secret-key-for-testing
      - NODE_ENV=development
    depends_on:
      - auth-service
      - cart-service
    networks:
      - shoptech-network
    volumes:
      - ./logs:/app/logs

  # Payment Service
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      - PORT=8086
      - JWT_SECRET=shoptech-secret-key-for-testing
      - NODE_ENV=development
    depends_on:
      - auth-service
      - order-service
    networks:
      - shoptech-network
    volumes:
      - ./logs:/app/logs

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - auth-service
      - user-service
      - product-service
      - cart-service
      - order-service
      - payment-service
    networks:
      - shoptech-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - shoptech-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - shoptech-network

volumes:
  prometheus-data:
  grafana-data:

networks:
  shoptech-network:
    driver: bridge